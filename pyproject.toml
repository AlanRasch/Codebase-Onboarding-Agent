[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-onboarder"
version = "1.0.0"
description = "Explains an unfamiliar codebase to new developers: overview, guide, and questions with file references."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
onboard = "onboarder.cli:main"

[tool.setuptools]
packages = ["onboarder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
